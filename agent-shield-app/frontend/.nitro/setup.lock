    "nitro:core": {
      "content": "{\n  \"manifestVersion\": 1,\n  \"name\": \"nitro-core\",\n  \"cli\": [\n    \"codex\",\n    \"third-party-code-cli\"\n  ],\n  \"defaultBundle\": \"default\",\n  \"bundles\": [\n    {\n      \"name\": \"default\",\n      \"skills\": []\n    }\n  ],\n  \"skills\": [],\n  \"agentsSections\": [\n    {\n      \"title\": \"Nitro Core\",\n      \"content\": \"Use Nitro setup artifacts, guardrails, verifications, and project-local tools.\\n\\n### AI Attribution Requirement\\n\\nChoose the attribution mechanism before finalizing:\\n- If the user or repository policy allows commit-message tracking, or the repository has a whole-codebase AI-generated baseline, use commit-message attribution.\\n- If the user or repository policy explicitly requires inline demarcation and no approved alternate tracking mechanism is available, use inline generated-code segment markers at the beginning and end of each generated segment.\\n- If the repository policy is unclear, ask the user before choosing the mechanism.\\n\\nBefore finalizing a change, classify it as one of:\\n- Primarily or entirely AI generated.\\n- Assisted by AI with substantial human contribution.\\n\\nOnly use the following commit trailers when commit-message attribution is the selected mechanism.\\n\\nFor primarily or entirely AI-generated changes, add this trailer to the commit message:\\n```\\nGenerated-by: AGENT_NAME:MODEL_VERSION [TOOL1] [TOOL2]\\n```\\n\\nFor AI-assisted changes with substantial human contribution, add this trailer to the commit message:\\n```\\nAssisted-by: AGENT_NAME:MODEL_VERSION [TOOL1] [TOOL2]\\n```\\n\\nWhen using `Assisted-by`, briefly describe the human vs. AI contribution in the commit body when reasonably possible. Do not fabricate model versions, agent names, or tool usage. If a value is unavailable, use the most specific known value and omit unknown optional tools.\\n\\nDo not paste third-party code or snippets. Run the repository's configured software composition analysis or snippet-detection tool before finalizing when such a tool is available. If no approved SCA tool is configured in the workspace, say that explicitly in the final response or commit notes instead of inventing a tool result.\",\n      \"order\": 0,\n      \"core\": true\n    }\n  ],\n  \"protectedPaths\": [\n    \"intelligence.url\",\n    \"intelligence.token\",\n    \"relay.url\",\n    \"relay.token\"\n  ]\n}\n",
