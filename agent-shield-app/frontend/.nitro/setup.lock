otePath\": \"skills/ojet-mvvm-to-nitro-migrate/references/component-map.md\",\n          \"sha256\": \"2621fba92f04bf0110155c389891f99ce478faebf308534027c00fe3c402043e\",\n          \"targetPath\": \"references/component-map.md\"\n        },\n        {\n          \"remotePath\": \"skills/ojet-mvvm-to-nitro-migrate/references/migration-manifest-schema.md\",\n          \"sha256\": \"0efcc4526cb3c3fa407bf45e19c39d3613ac017939f2cc5e61526b8ca41212cd\",\n          \"targetPath\": \"references/migration-manifest-schema.md\"\n        },\n        {\n          \"remotePath\": \"skills/ojet-mvvm-to-nitro-migrate/references/ojet-mvvm-source-guide.md\",\n          \"sha256\": \"772c49d864af3847105b2dd5ececf4b86a5a0e2f005ffd17b2e674f29158105c\",\n          \"targetPath\": \"references/ojet-mvvm-source-guide.md\"\n        },\n        {\n          \"remotePath\": \"skills/ojet-mvvm-to-nitro-migrate/references/page-patterns.md\",\n          \"sha256\": \"7bd53e0ec330063173e028132127cb1e517021aca586225e922d02284a1b328c\",\n          \"targetPath\": \"references/page-patterns.md\"\n        },\n        {\n          \"remotePath\": \"skills/ojet-mvvm-to-nitro-migrate/scripts/audit-ojet-mvvm-routes.ts\",\n          \"sha256\": \"dc7d37e4eda1a23ff3836d91ac6f1a156de74de952e237f42fcb199d2d78898a\",\n          \"targetPath\": \"scripts/audit-ojet-mvvm-routes.ts\"\n        },\n        {\n          \"remotePath\": \"skills/ojet-mvvm-to-nitro-migrate/SKILL.md\",\n          \"sha256\": \"92383ef446eb560618aa0c5279fda889f1027b07d095fbb6cdd2584539a4a10a\",\n          \"targetPath\": \"SKILL.md\"\n        }\n      ],\n      \"name\": \"ojet-mvvm-to-nitro-migrate\"\n    },\n    {\n      \"description\": \"Use when creating, editing, splitting, merging, or extracting content from PDF documents. Triggers on any request to generate a PDF, fill a PDF form, extract text or tables from a PDF, combine PDFs, or convert between PDF and other formats. Covers form fields (AcroForm), page-level manipulation, and conversion through LibreOffice `soffice` when HTML/Markdown input must be rendered to PDF.\",\n      \"files\": [\n        {\n          \"remotePath\": \"skills/pdf/scripts/__init__.py\",\n          \"sha256\": \"e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855\",\n          \"targetPath\": \"scripts/__init__.py\"\n        },\n        {\n          \"remotePath\": \"skills/pdf/scripts/extract_text.py\",\n          \"sha256\": \"25f16edfea65ba95d475cb2b371526e373987b906ca1e6e3b5f8bacb544e2319\",\n          \"targetPath\": \"scripts/extract_text.py\"\n        },\n        {\n          \"remotePath\": \"skills/pdf/scripts/fill_fillable_fields.py\",\n          \"sha256\": \"e12d7df9cb8e9faab2ef37a14a861c45eec9e33c33afed306049318bec5ce271\",\n          \"targetPath\": \"scripts/fill_fillable_fields.py\"\n        },\n        {\n          \"remotePath\": \"skills/pdf/scripts/merge.py\",\n          \"sha256\": \"ca505e72cff0f0bf0d8d5f6c82dd9e9bf1e56cf52e4d337223711b09cdcc03d9\",\n          \"targetPath\": \"scripts/merge.py\"\n        },\n        {\n          \"remotePath\": \"skills/pdf/scripts/render_pdf.py\",\n          \"sha256\": \"f6e697d35f88a74d856bb707e97e3b0783fc22cea0c5f986fe72e1123531b367\",\n          \"targetPath\": \"scripts/render_pdf.py\"\n        },\n        {\n          \"remotePath\": \"skills/pdf/scripts/split.py\",\n          \"sha256\": \"a288c65524a26bd1c9f2441375031886b0cbe12b7f64e68c151a30cbec0945f0\",\n          \"targetPath\": \"scripts/split.py\"\n        },\n        {\n          \"remotePath\": \"skills/pdf/scripts/verify_pdf.py\",\n          \"sha256\": \"d5f2f5e6021a8919d5ef906b92187d84d56a6548481bdf9cdb692e53023f7eaf\",\n          \"targetPath\": \"scripts/verify_pdf.py\"\n        },\n        {\n          \"remotePath\": \"skills/pdf/SKILL.md\",\n          \"sha256\": \"de3055844eab8ffd95fe379ff1a721c09bbd67f7a0b26403b3173536dd0cfd70\",\n          \"targetPath\": \"SKILL.md\"\n        }\n      ],\n      \"name\": \"pdf\"\n    },\n    {\n      \"description\": \"Use when creating, editing, or analyzing Microsoft PowerPoint presentations (.pptx, .pptm, .potx). Triggers on requests to build a deck, add or replace slides, apply a corporate theme, clean layout residue, or generate slide thumbnails. All outputs on this project must follow the Oracle Redwood FY26 brand — see `redwood-tokens.json` and `redwood-theme.js`. Prefer pptxgenjs for programmatic authoring (see `pptxgenjs.md`); drop to raw OOXML edits via `scripts/unpack.py` / `scripts/pack.py` when surgical XML changes are required.\",\n      \"files\": [\n        {\n          \"remotePath\": \"skills/pptx/pptxgenjs.md\",\n          \"sha256\": \"40ff63dafaba834df19943b6e6c6578576e89a03d1a6788787c7914335e9f174\",\n          \"targetPath\": \"pptxgenjs.md\"\n        },\n        {\n          \"remotePath\": \"skills/pptx/redwood-theme.js\",\n          \"sha256\": \"750db26260034508e63be78759581eb721c1b24477c3de9b66e432f98235444a\",\n          \"targetPath\": \"redwood-theme.js\"\n        },\n        {\n          \"remotePath\": \"skills/pptx/redwood-tokens.json\",\n          \"sha256\": \"b28069a5c92336b1702a2b7d7e42988aaff1c52621774404e3f61c89653dab67\",\n          \"targetPath\": \"redwood-tokens.json\"\n        },\n        {\n          \"remotePath\": \"skills/pptx/scripts/__init__.py\",\n          \"sha256\": \"57f62cf96405105a20823ba9584e0a96d33be54a4943497857ad88ffc3ebbf78\",\n          \"targetPath\": \"scripts/__init__.py\"\n        },\n        {\n          \"remotePath\": \"skills/pptx/scripts/add_slide.py\",\n          \"sha256\": \"551dd8f6ddd4a3f611993aa672d65cac5154c0e63a38c005eab8bec9968b87bc\",\n          \"targetPath\": \"scripts/add_slide.py\"\n        },\n        {\n          \"remotePath\": \"skills/pptx/scripts/clean.py\",\n          \"sha256\": \"d88b3ca59c57a761bce96041fcb7a9e13e7a6d7d5cc94dbb9b1a698d7347aee5\",\n          \"targetPath\": \"scripts/clean.py\"\n        },\n        {\n          \"remotePath\": \"skill