{
  "version": 1,
  "manifests": {
    "https://nitro.oraclecorp.com/docs/skills/codex/index.json": {
      "content": "{\n  \"bundles\": [\n    {\n      \"name\": \"default\",\n      \"skills\": [\n        \"docx\",\n        \"nitro-app-bootstrap\",\n        \"nitro-app-doctor\",\n        \"nitro-component-discovery\",\n        \"nitro-extension-authoring\",\n        \"nitro-migration-common\",\n        \"nitro-pack-installer\",\n        \"nitro-page-authoring\",\n        \"nitro-sprint-presentation\",\n        \"nitro-wrap-components\",\n        \"oci-deploy\",\n        \"ojet-mvvm-to-nitro-migrate\",\n        \"pdf\",\n        \"pptx\",\n        \"rapid-to-nitro-migrate\",\n        \"xlsx\"\n      ]\n    }\n  ],\n  \"cli\": \"codex\",\n  \"defaultBundle\": \"default\",\n  \"manifestVersion\": 1,\n  \"packsIndexPath\": \"packs/index.json\",\n  \"packsIndexSha256\": \"f510c9b7410904e9cf2c13dfb2e2111458d5873542f0b0f44ab6cd578595c6a5\",\n  \"registryPath\": \"r/registry.json\",\n  \"skills\": [\n    {\n      \"description\": \"Use when creating, editing, or analyzing Microsoft Word documents (.docx, .docm). Triggers on requests to write a Word document, fill a template, accept or reject tracked changes, add comments, merge sections, or convert DOCX to other formats. Works with the Office Open XML (ECMA-376 / ISO 29500) format directly by unpacking the archive, editing XML parts, and repacking — no proprietary tooling required.\",\n      \"files\": [\n        {\n          \"remotePath\": \"skills/docx/scripts/__init__.py\",\n          \"sha256\": \"e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855\",\n          \"targetPath\": \"scripts/__init__.py\"\n        },\n        {\n          \"remotePath\": \"skills/docx/scripts/accept_changes.py\",\n          \"sha256\": \"47b3bfc70b1d77953cce5da4746b86daba1e5709927ddbfb1f241fee968f2b6c\",\n          \"targetPath\": \"scripts/accept_changes.py\"\n        },\n        {\n          \"remotePath\": \"skills/docx/scripts/append_paragraph.py\",\n          \"sha256\": \"68d8e3e7c70a8d9045ee0ead41a70fbfdc0dfdf71790181d72bd28192934c0de\",\n          \"targetPath\": \"scripts/append_paragraph.py\"\n        },\n        {\n          \"remotePath\": \"skills/docx/scripts/comment.py\",\n          \"sha256\": \"5c970be431085a1195533f3914e52ea8a3431f34d59959e28f29c8c8c90708aa\",\n          \"targetPath\": \"scripts/comment.py\"\n        },\n        {\n          \"remotePath\": \"skills/docx/scripts/pack.py\",\n          \"sha256\": \"1b6b1c4f192570eeb4e886afc17fa40f5a37f899b6a8d9abf3f8fb51b1803497\",\n          \"targetPath\": \"scripts/pack.py\"\n        },\n        {\n          \"remotePath\": \"skills/docx/scripts/reject_changes.py\",\n          \"sha256\": \"552a38162d5867623956349e20012ed6a168940c3c6852f0ab2badbb8b01b1ca\",\n          \"targetPath\": \"scripts/reject_changes.py\"\n        },\n        {\n          \"remotePath\": \"skills/docx/scripts/unpack.py\",\n          \"sha256\": \"f062be82d373be9ad9348f5c9c6f300a5bac8ae5b290d3a3c16bf3303f7d2017\",\n          \"targetPath\": \"scripts/unpack.py\"\n        },\n        {\n          \"remotePath\": \"skills/docx/scripts/verify.py\",\n          \"sha256\": \"1fd52eb9c068aa98edef159da0d2cd558c0a1275b419e14e9fc756e9c3f9d930\",\n          \"targetPath\": \"scripts/verify.py\"\n        },\n        {\n          \"remotePath\": \"skills/docx/SKILL.md\",\n          \"sha256\": \"52acaec2def071031cef56882950b69e4a29cef0d4ee932e21613389b6edc251\",\n          \"targetPath\": \"SKILL.md\"\n        }\n      ],\n      \"name\": \"docx\"\n    },\n    {\n      \"description\": \"Scaffold a new Nitro application using the CLI. MUST be used instead of hand-building files. Includes verification gates and local tool setup expectations.\",\n      \"files\": [\n        {\n          \"remotePath\": \"skills/nitro-app-bootstrap/SKILL.md\",\n          \"sha256\": \"4dd017e87fbb41e6f499dafa4ddc81f689c2e9d5f17a818c402f6c2296d3c856\",\n          \"targetPath\": \"SKILL.md\"\n        }\n      ],\n      \"name\": \"nitro-app-bootstrap\"\n    },\n    {\n      \"description\": \"Diagnose and fix Nitro app configuration issues. Run when scaffold, verify, or dev server fails.\",\n      \"files\": [\n        {\n          \"remotePath\": \"skills/nitro-app-doctor/SKILL.md\",\n          \"sha256\": \"dbf2c4a3d92feb6fa9f392e423d25ec34bf5f81ccbdbc65ebabb308a7ffcfa00\",\n          \"targetPath\": \"SKILL.md\"\n        }\n      ],\n      \"name\": \"nitro-app-doctor\"\n    },\n    {\n      \"description\": \"Discover Nitro UI components and page templates from the @nitro registry, then consume them from @idp/nitro-redwood by default. ALWAYS search the registry before creating ANY UI.\",\n      \"files\": [\n        {\n          \"remotePath\": \"skills/nitro-component-discovery/SKILL.md\",\n          \"sha256\": \"d0b3afeef020a579094c029b53fceedd9a94b78d63f9d46bf39e9c89728b4375\",\n          \"targetPath\": \"SKILL.md\"\n        }\n      ],\n      \"name\": \"nitro-component-discovery\"\n    },\n    {\n      \"description\": \"Build, review, or harden Nitro extensions that publish skills, guardrails, files, project templates, doctor checks, and verification commands through hosted Nitro setup manifests. Use when creating Nitro extensions or helping integrators package extension artifacts for nitro-cli setup and nitro-cli new --template usage.\",\n      \"files\": [\n        {\n          \"remotePath\": \"skills/nitro-extension-authoring/SKILL.md\",\n          \"sha256\": \"489fe75feab49a6e41839a37ce1fd067f3c70f8b07ec6c40b2b4de5f57e2ad14\",\n          \"targetPath\": \"SKILL.md\"\n        }\n      ],\n      \"name\": \"nitro-extension-authoring\"\n    },\n    {\n      \"description\": \"Shared Nitro migration references and source-vs-Nitro parity scripts used by RAPID, OJET MVVM, Oracle Spectra, and similar legacy-to-Nitro migration skills.\",\n      \"files\": [\n        {\n          \"remotePath\": \"skills/nitro-migration-common/references/common-route-workflow.md\",\n          \"sha256\": \"6a2985648e2b1a304af25733640ed67fec7b69b60db00b004c4d1f51bdc64784\",\n          \"targetPath\": \"references/common-route-workflow.md\"\n        },\n        {\n          \"remotePath\": \"skills/nitro-migration-common/references/migration-progress-schema.md\",\n          \"sha256\": \"f110ad5a0f6524c7aa1b0e3bb85c0ab3f8bc18d9dea95bcda94dad24abfafbf4\",\n          \"targetPath\": \"references/migration-progress-schema.md\"\n        },\n        {\n          \"remotePath\": \"skills/nitro-migration-common/references/route-parity-checklist.md\",\n          \"sha256\": \"49f7c9bc969868f9ac719a74cbe752c09588f5044b0bc5d8607dc5e0b85f84c9\",\n          \"targetPath\": \"references/route-parity-checklist.md\"\n        },\n        {\n          \"remotePath\": \"skills/nitro-migration-common/references/route-parity-report-template.md\",\n          \"sha256\": \"a85a0a53d17c92c48a8f6661e9d7731ffdea1f8363ee28f8cf0452248d78a9ab\",\n          \"targetPath\": \"references/route-parity-report-template.md\"\n        },\n        {\n          \"remotePath\": \"skills/nitro-migration-common/scripts/capture-route-parity.ts\",\n          \"sha256\": \"e4d5cea3002304c12cdb8b55c0a1d967d1a6a0c74fcab1a2a23bcee8e6ffbb4a\",\n          \"targetPath\": \"scripts/capture-route-parity.ts\"\n        },\n        {\n          \"remotePath\": \"skills/nitro-migration-common/scripts/generate-parity-report.ts\",\n          \"sha256\": \"a7186e18f7c1ae150cb089fc52e561bb612d601b0c0cd24f412c64b8e0968a04\",\n          \"targetPath\": \"scripts/generate-parity-report.ts\"\n        },\n        {\n          \"remotePath\": \"skills/nitro-migration-common/scripts/validate-api-contract-closure.ts\",\n          \"sha256\": \"3b5c49489bfc8df9f0d1b5c1ae047948b890ce57ff27512a6fe89dbcea64c5d7\",\n          \"targetPath\": \"scripts/validate-api-contract-closure.ts\"\n        },\n        {\n          \"remotePath\": \"skills/nitro-migration-common/SKILL.md\",\n          \"sha256\": \"3ad9dfdda3a0a58e995085b5fbcce20ffed9c88e2a3499c671bb8f31458323e0\",\n          \"targetPath\": \"SKILL.md\"\n        }\n      ],\n      \"name\": \"nitro-migration-common\"\n    },\n    {\n      \"description\": \"Install deterministic Nitro packs that bundle components, routes, and assets into one-command installs.\",\n      \"files\": [\n        {\n          \"remotePath\": \"skills/nitro-pack-installer/SKILL.md\",\n          \"sha256\": \"295001d7a577fa3017262dfe4a3ce6618ea037c62d3adf827a94d2b6095e0e90\",\n          \"targetPath\": \"SKILL.md\"\n        }\n      ],\n      \"name\": \"nitro-pack-installer\"\n    },\n    {\n      \"description\": \"Create Nitro route pages by first searching the @nitro registry for page templates, then importing package templates from @idp/nitro-redwood. Pages must use usePage/usePageHeader hooks.\",\n      \"files\": [\n        {\n          \"remotePath\": \"skills/nitro-page-authoring/SKILL.md\",\n          \"sha256\": \"7731979952a977dc08ba06b2b7d5d0f573a2e7302786da09ea1a2fa7d4fe2d2d\",\n          \"targetPath\": \"SKILL.md\"\n        }\n      ],\n      \"name\": \"nitro-page-authoring\"\n    },\n    {\n      \"description\": \"Generate or update the NITRO Sprint PowerPoint deck from the Oracle Corporate template using Jira ALPS board sprint data and Slack engagement data. Use when the user asks for a Nitro sprint presentation, Sprint 118-style deck, NITRO-PRESENTATION refresh, or to build the same template by sprint number or date range.\",\n      \"files\": [\n        {\n          \"remotePath\": \"skills/nitro-sprint-presentation/agents/openai.yaml\",\n          \"sha256\": \"f148d97ef996bc3efb0b2b462392aa9f79a503848a1b2fa35507b33e9bd20918\",\n          \"targetPath\": \"agents/openai.yaml\"\n        },\n        {\n          \"remotePath\": \"skills/nitro-sprint-presentation/assets/color-strip-05.png\",\n          \"sha256\": \"2e87b18d199f9bbc13fcdd27613c1d5453fb6ee95412a92e093400c9f3c8a1f7\",\n          \"targetPath\": \"assets/color-strip-05.png\"\n        },\n        {\n          \"remotePath\": \"skills/nitro-sprint-presentation/assets/oracle-template.pptx\",\n          \"sha256\": \"48dd63791bcc190eb4cc93864cada55b46ba62c44a857a6febd468106437e74f\",\n          \"targetPath\": \"assets/oracle-template.pptx\"\n        },\n        {\n          \"remotePath\": \"skills/nitro-sprint-presentation/references/data-fetching.md\",\n          \"sha256\": \"85fe3eb8ff5e20f3a2eeb47bb8d9de897bd62a557a07e4a687d0a96cb81b7201\",\n          \"targetPath\": \"references/data-fetching.md\"\n        },\n        {\n          \"remotePath\": \"skills/nitro-sprint-presentation/scripts/build_nitro_sprint_deck.mjs\",\n          \"sha256\": \"d0e2e8ba061b24b1fc04b6a8dcf1228a4a5f0cf92b488eb33b3e6a25938b03d7\",\n          \"targetPath\": \"scripts/build_nitro_sprint_deck.mjs\"\n        },\n        {\n          \"remotePath\": \"skills/nitro-sprint-presentation/SKILL.md\",\n          \"sha256\": \"301f06d2cfa4b57d09f7d60923b0cc93abf07aa9ce5d1d9ea9f75b3b696fd1e0\",\n          \"targetPath\": \"SKILL.md\"\n        }\n      ],\n      \"name\": \"nitro-sprint-presentation\"\n    },\n    {\n      \"description\": \"Use when creating, auditing, validating, or updating team-owned wrapper components around Nitro `@nitro` shadcn registry components. Triggers when teams need pass-through wrappers, data-testid/test hooks, default prop injection, prop remapping, compatibility adapters for Nitro API changes, or full-registry wrapper coverage with deterministic tests.\",\n      \"files\": [\n        {\n          \"remotePath\": \"skills/nitro-wrap-components/references/wrapper-config.md\",\n          \"sha256\": \"b3ef282c4a0126e5dce9a52787f33db70254cb8075af63506fd475dabea2a15a\",\n          \"targetPath\": \"references/wrapper-config.md\"\n        },\n        {\n          \"remotePath\": \"skills/nitro-wrap-components/scripts/nitro-wrapper.mjs\",\n          \"sha256\": \"e61b9271fd09695af315c7e7f431e337273f35fd36c1acfc7e9be2217850d363\",\n          \"targetPath\": \"scripts/nitro-wrapper.mjs\"\n        },\n        {\n          \"remotePath\": \"skills/nitro-wrap-components/SKILL.md\",\n          \"sha256\": \"5c0d58199889d7ea75350619ab6f25a14b00560d86ac7fdb7207a030513fc588\",\n          \"targetPath\": \"SKILL.md\"\n        }\n      ],\n      \"name\": \"nitro-wrap-components\"\n    },\n    {\n      \"description\": \"Use when deploying applications or infrastructure to Oracle Cloud Infrastructure (OCI) using Terraform. Triggers on any mention of OCI, Oracle Cloud, OCIR, Container Instances, OKE, or requests to deploy, provision, or scaffold cloud infrastructure targeting Oracle's cloud. Also triggers when the user mentions Terraform with Oracle-specific services like Autonomous DB, OCI DevOps, OCI Functions, OCI Cache, or OCI OpenSearch. Covers the full end-to-end: SCM, CI/CD pipelines, infrastructure provisioning, and verification.\",\n      \"files\": [\n        {\n          \"remotePath\": \"skills/oci-deploy/references/container-instances.md\",\n          \"sha256\": \"5251d12047052fd39344544cf67bcfd5b6eb365296f1884cec7b1508077d5134\",\n          \"targetPath\": \"references/container-instances.md\"\n        },\n        {\n          \"remotePath\": \"skills/oci-deploy/references/database.md\",\n          \"sha256\": \"3692dca76b6d4f1c6fc6c021eefcaf1191cfcd7b80ae63f47b0c8037fe185c28\",\n          \"targetPath\": \"references/database.md\"\n        },\n        {\n          \"remotePath\": \"skills/oci-deploy/references/devops-pipelines.md\",\n          \"sha256\": \"297bd93b7a810e2e4b9cdb158de589a4e59fac1cd50ed38b0c937aade43af875\",\n          \"targetPath\": \"references/devops-pipelines.md\"\n        },\n        {\n          \"remotePath\": \"skills/oci-deploy/references/iam-security.md\",\n          \"sha256\": \"64f6a97ad3d49239d323913376877e1b46854ff2d07581533dfe6e136297aea5\",\n          \"targetPath\": \"references/iam-security.md\"\n        },\n        {\n          \"remotePath\": \"skills/oci-deploy/references/networking.md\",\n          \"sha2